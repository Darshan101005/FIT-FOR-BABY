<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fit for Baby - Opening App...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 109, 171, 0.15);
    }
    h1 {
      color: #1e293b;
      font-size: 24px;
      margin-bottom: 12px;
    }
    .message {
      color: #64748b;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #006dab;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      width: 100%;
      margin-bottom: 12px;
    }
    .btn-primary {
      background: #006dab;
      color: white;
    }
    .btn-primary:hover {
      background: #005a8f;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .hidden {
      display: none;
    }
    .fallback {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }
    .fallback p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .store-links {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .store-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: #1e293b;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
    }
    .store-link:hover {
      background: #334155;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Loading State -->
    <div id="loading">
      <h1>Opening Fit for Baby...</h1>
      <p class="message">Please wait while we redirect you to the app.</p>
      <div class="spinner"></div>
    </div>
    
    <!-- Fallback State (if app doesn't open) -->
    <div id="fallback" class="hidden">
      <h1>Set Your Password</h1>
      <p class="message">Choose how you'd like to continue:</p>
      
      <button id="openAppBtn" class="btn btn-primary">Open in App</button>
      <a id="webLink" href="#" class="btn btn-secondary">Continue in Browser</a>
      
      <div class="fallback">
        <p>Don't have the app installed?</p>
        <div class="store-links">
          <a href="https://github.com/Darshan101005/FIT-FOR-BABY/releases/download/APK/FIT-FOR-BABY-v1.0.0.apk" class="store-link" target="_blank">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,17L7,12H10V8H14V12H17L12,17Z"/></svg>
            Download APK (Android)
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // Parse URL parameters
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const username = params.get('username');
      const password = params.get('password');
      
      // Build query string - support both old token and new username+password format
      let queryString = '';
      if (username && password) {
        queryString = 'username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password);
      } else if (token) {
        queryString = 'token=' + encodeURIComponent(token);
      } else {
        // No valid params - redirect to home
        window.location.href = '/';
        return;
      }
      
      // Deep link URL for the app
      const appDeepLink = 'fitforbaby://reset-password?' + queryString;
      
      // Web fallback URL
      const webUrl = '/reset-password?' + queryString;
      
      // Set up fallback links
      document.getElementById('webLink').href = webUrl;
      document.getElementById('openAppBtn').onclick = function() {
        window.location.href = appDeepLink;
      };
      
      // Detect if on mobile
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      
      if (isMobile) {
        // Try to open the app
        let appOpened = false;
        
        // Create hidden iframe for deep link (works better on some devices)
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = appDeepLink;
        document.body.appendChild(iframe);
        
        // Also try direct navigation
        setTimeout(function() {
          window.location.href = appDeepLink;
        }, 100);
        
        // Check if we're still here after delay (app didn't open)
        setTimeout(function() {
          // If page is still visible, app didn't open
          if (!document.hidden) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('fallback').classList.remove('hidden');
          }
        }, 2500);
        
        // Listen for visibility change (app opened)
        document.addEventListener('visibilitychange', function() {
          if (document.hidden) {
            appOpened = true;
          }
        });
      } else {
        // Desktop - go directly to web version
        window.location.href = webUrl;
      }
    })();
  </script>
</body>
</html>
